name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  ACR_NAME: detroitrunner.azurecr.io
  IMAGE_NAME: detroitrunner

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to ACR
        run: |
          docker login $ACR_NAME \
             -u ${{ secrets.ACR_USERNAME }} \
             -p ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
            -t $ACR_NAME/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push $ACR_NAME/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name detroitrunner \
            --resource-group protea \
            --image $ACR_NAME/$IMAGE_NAME:${{ github.sha }}
